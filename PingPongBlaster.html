<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Ping Pong Blaster — Ultimate Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --accent:#00ff99;--accent2:#ff6b35;--bg:#070c14;--coin:#f1c40f;
  --common:#9aaab8;--rare:#4a9eff;--epic:#b94fff;--legendary:#ff9500;
}
body{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Rajdhani',sans-serif;overflow:hidden;color:#fff;}
canvas{border:2px solid rgba(0,255,153,0.35);border-radius:6px;cursor:none;display:block;box-shadow:0 0 40px rgba(0,255,153,0.12),0 20px 60px rgba(0,0,0,0.7);}

/* ── TOP UI ── */
#ui{display:flex;align-items:center;gap:16px;margin-bottom:8px;font-size:15px;font-weight:700;letter-spacing:.5px;color:#c8ffe8;font-family:'Orbitron',monospace;flex-wrap:wrap;justify-content:center;}
#xpBar{width:180px;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;}
#xpFill{height:100%;background:linear-gradient(90deg,#00ff99,#00ccff);border-radius:4px;transition:width .4s;}
.ui-lvl{color:#00ff99;font-size:13px;}
.ui-coins{color:var(--coin);}

/* ── OVERLAY ── */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);}
.panel{background:linear-gradient(140deg,rgba(8,20,40,0.98),rgba(4,10,22,0.98));border:1px solid rgba(0,255,153,0.2);border-radius:18px;padding:28px 32px;max-width:580px;width:94%;text-align:center;box-shadow:0 0 80px rgba(0,255,153,0.08);max-height:92vh;overflow-y:auto;}
.panel h1{font-family:'Orbitron',monospace;font-size:1.8rem;color:var(--accent);text-shadow:0 0 24px rgba(0,255,153,0.4);margin-bottom:6px;}
.subtitle{color:#7fc0a0;font-size:.95rem;margin-bottom:16px;line-height:1.6;}
.rules{color:#8fb0a0;font-size:.85rem;line-height:1.7;margin-bottom:18px;text-align:left;background:rgba(255,255,255,0.04);border-radius:8px;padding:10px 14px;}

/* ── BUTTONS ── */
.btn{background:linear-gradient(135deg,var(--accent),#00cc77);color:#061a10;border:none;padding:10px 22px;border-radius:28px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Orbitron',monospace;letter-spacing:.5px;transition:all .18s;box-shadow:0 4px 18px rgba(0,255,153,0.25);}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,255,153,0.45);}
.btn.orange{background:linear-gradient(135deg,#ff8c42,var(--accent2));color:#fff;box-shadow:0 4px 18px rgba(255,107,53,0.25);}
.btn.orange:hover:not(:disabled){box-shadow:0 6px 24px rgba(255,107,53,0.45);}
.btn.purple{background:linear-gradient(135deg,#9b44ff,#6a1adf);color:#fff;box-shadow:0 4px 18px rgba(155,68,255,0.3);}
.btn.gold{background:linear-gradient(135deg,#ffd700,#ff9500);color:#1a0d00;box-shadow:0 4px 18px rgba(255,149,0,0.3);}
.btn.secondary{background:rgba(255,255,255,0.07);color:#c8ffe8;border:1px solid rgba(0,255,153,0.25);box-shadow:none;}
.btn.secondary:hover:not(:disabled){background:rgba(0,255,153,0.1);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;}

/* ── TABS ── */
.tabs{display:flex;gap:6px;margin-bottom:14px;justify-content:center;flex-wrap:wrap;}
.tab{padding:7px 16px;border-radius:20px;border:1px solid rgba(0,255,153,0.2);background:transparent;color:#7fc0a0;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.88rem;transition:all .18s;}
.tab.active{background:rgba(0,255,153,0.14);color:var(--accent);border-color:rgba(0,255,153,0.45);}

/* ── SHOP GRID ── */
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:340px;overflow-y:auto;padding:2px;}
.shop-item{background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 8px;text-align:center;transition:all .18s;position:relative;}
.shop-item:hover{border-color:rgba(0,255,153,0.35);background:rgba(0,255,153,0.055);}
.shop-item.owned{border-color:rgba(0,255,153,0.4);}
.shop-item.active-item{border-color:var(--accent);background:rgba(0,255,153,0.09);box-shadow:0 0 14px rgba(0,255,153,0.18);}
.shop-item.rarity-common{border-color:rgba(154,170,184,0.4);}
.shop-item.rarity-rare{border-color:rgba(74,158,255,0.5);}
.shop-item.rarity-epic{border-color:rgba(185,79,255,0.55);}
.shop-item.rarity-legendary{border-color:rgba(255,149,0,0.6);box-shadow:0 0 12px rgba(255,149,0,0.2);}
.badge-row{position:absolute;top:5px;right:5px;display:flex;flex-direction:column;gap:2px;align-items:flex-end;}
.badge{font-size:.6rem;padding:2px 5px;border-radius:8px;font-weight:700;}
.badge.owned{background:rgba(0,255,153,0.18);color:var(--accent);}
.badge.active{background:var(--accent);color:#061a10;}
.badge.bp{background:rgba(155,68,255,0.3);color:#cc88ff;}
.badge.loot{background:rgba(255,149,0,0.2);color:#ffbb44;}
.item-name{font-weight:700;font-size:.85rem;margin:5px 0 2px;}
.item-price{font-size:.78rem;display:flex;align-items:center;justify-content:center;gap:3px;}
.item-sub{font-size:.7rem;color:#558;margin-top:2px;}
.rarity-label{font-size:.65rem;font-weight:700;padding:1px 5px;border-radius:6px;display:inline-block;margin-bottom:4px;}
.rarity-common .rarity-label{background:rgba(154,170,184,.2);color:var(--common);}
.rarity-rare .rarity-label{background:rgba(74,158,255,.2);color:var(--rare);}
.rarity-epic .rarity-label{background:rgba(185,79,255,.2);color:var(--epic);}
.rarity-legendary .rarity-label{background:rgba(255,149,0,.2);color:var(--legendary);}

/* ── LEVEL / PROGRESS ── */
.level-card{background:rgba(0,255,153,0.07);border:1px solid rgba(0,255,153,0.25);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;gap:16px;align-items:center;text-align:left;}
.level-num{font-family:'Orbitron',monospace;font-size:2.4rem;color:var(--accent);line-height:1;}
.level-info{flex:1;}
.xp-bar-large{height:10px;background:rgba(255,255,255,0.1);border-radius:5px;overflow:hidden;margin-top:5px;}
.xp-fill-large{height:100%;background:linear-gradient(90deg,#00ff99,#00ccff);border-radius:5px;transition:width .5s;}

/* ── ACHIEVEMENTS ── */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:360px;overflow-y:auto;}
.ach-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:10px;}
.ach-card.done{border-color:rgba(241,196,15,0.5);background:rgba(241,196,15,0.06);}
.ach-icon{font-size:1.6rem;flex-shrink:0;}
.ach-name{font-weight:700;font-size:.88rem;}
.ach-desc{font-size:.75rem;color:#778;}
.ach-prog{font-size:.72rem;color:#aaa;margin-top:2px;}
.ach-prog-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:4px;overflow:hidden;}
.ach-prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),#00ccff);border-radius:2px;}

/* ── BATTLE PASS ── */
.bp-track{display:flex;gap:0;overflow-x:auto;padding:8px 0 12px;margin:0 -4px;}
.bp-node{flex-shrink:0;width:80px;text-align:center;position:relative;}
.bp-node::before{content:'';position:absolute;top:22px;left:50%;width:100%;height:3px;background:rgba(255,255,255,0.1);z-index:0;}
.bp-node:last-child::before{display:none;}
.bp-node.unlocked::before{background:linear-gradient(90deg,rgba(0,255,153,0.6),rgba(0,204,255,0.4));}
.bp-circle{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin:0 auto 5px;position:relative;z-index:1;transition:all .25s;}
.bp-node.unlocked .bp-circle{border-color:rgba(0,255,153,0.6);background:rgba(0,255,153,0.12);box-shadow:0 0 14px rgba(0,255,153,0.25);}
.bp-node.current .bp-circle{border-color:var(--accent);background:rgba(0,255,153,0.2);box-shadow:0 0 20px rgba(0,255,153,0.4);animation:bpPulse 1.5s infinite;}
.bp-node.legendary-node .bp-circle{border-color:var(--legendary);background:rgba(255,149,0,0.12);}
.bp-node.legendary-node.unlocked .bp-circle{box-shadow:0 0 18px rgba(255,149,0,0.5);}
@keyframes bpPulse{0%,100%{box-shadow:0 0 20px rgba(0,255,153,0.4);}50%{box-shadow:0 0 30px rgba(0,255,153,0.7);}}
.bp-lvl{font-size:.65rem;color:#556;font-weight:700;}
.bp-name{font-size:.68rem;color:#8fb0a0;margin-top:2px;}

/* ── LOOT ── */
.crate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}
.crate{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.12);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.crate:hover:not(.locked){transform:translateY(-3px);}
.crate.common-crate{border-color:rgba(154,170,184,.4);}
.crate.rare-crate{border-color:rgba(74,158,255,.5);box-shadow:0 0 12px rgba(74,158,255,0.1);}
.crate.epic-crate{border-color:rgba(185,79,255,.55);box-shadow:0 0 14px rgba(185,79,255,0.15);}
.crate.legendary-crate{border-color:rgba(255,149,0,.6);box-shadow:0 0 18px rgba(255,149,0,0.25);animation:crateGlow 2s infinite alternate;}
@keyframes crateGlow{from{box-shadow:0 0 18px rgba(255,149,0,.25);}to{box-shadow:0 0 32px rgba(255,149,0,.5);}}
.crate.locked{opacity:.45;cursor:not-allowed;}
.crate-icon{font-size:2.4rem;margin-bottom:6px;}
.crate-name{font-weight:700;font-size:.9rem;}
.crate-price{font-size:.78rem;color:var(--coin);margin-top:4px;}
.crate-odds{font-size:.65rem;color:#556;margin-top:3px;}

/* ── LOOT REVEAL ── */
.loot-reveal{text-align:center;padding:10px 0;}
.loot-reveal .item-big{font-size:4rem;animation:itemBounce .5s ease;}
@keyframes itemBounce{0%{transform:scale(0.3);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
.rarity-glow{padding:6px 18px;border-radius:20px;font-family:'Orbitron',monospace;font-size:.85rem;font-weight:700;display:inline-block;margin:8px 0;}
.rarity-glow.common{background:rgba(154,170,184,.15);color:var(--common);}
.rarity-glow.rare{background:rgba(74,158,255,.2);color:var(--rare);box-shadow:0 0 16px rgba(74,158,255,.3);}
.rarity-glow.epic{background:rgba(185,79,255,.2);color:var(--epic);box-shadow:0 0 20px rgba(185,79,255,.35);}
.rarity-glow.legendary{background:rgba(255,149,0,.2);color:var(--legendary);box-shadow:0 0 28px rgba(255,149,0,.5);animation:legendaryPulse 1s infinite alternate;}
@keyframes legendaryPulse{from{box-shadow:0 0 28px rgba(255,149,0,.4);}to{box-shadow:0 0 44px rgba(255,149,0,.8);}}

/* ── NOTIFICATION TOAST ── */
#toasts{position:fixed;top:12px;right:12px;z-index:999;display:flex;flex-direction:column;gap:8px;}
.toast{background:linear-gradient(135deg,rgba(8,24,44,0.97),rgba(4,14,28,0.97));border:1px solid rgba(0,255,153,0.35);border-radius:10px;padding:10px 14px;font-size:.85rem;color:#c8ffe8;max-width:280px;box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:toastIn .3s ease;display:flex;align-items:center;gap:8px;}
.toast.ach-toast{border-color:rgba(241,196,15,.5);background:linear-gradient(135deg,rgba(30,22,4,.97),rgba(16,10,0,.97));}
.toast.lvl-toast{border-color:rgba(0,255,153,.6);box-shadow:0 4px 24px rgba(0,255,153,.2);}
.toast.legendary-toast{border-color:rgba(255,149,0,.6);box-shadow:0 4px 24px rgba(255,149,0,.3);}
@keyframes toastIn{from{transform:translateX(100%);opacity:0;}to{transform:none;opacity:1;}}
@keyframes toastOut{to{transform:translateX(110%);opacity:0;}}

/* ── MISC ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:rgba(255,255,255,0.04);}
::-webkit-scrollbar-thumb{background:rgba(0,255,153,0.25);border-radius:3px;}
</style>
</head>
<body>
<div id="ui">
  <span id="sc" style="font-size:14px">Score: 0</span>
  <span style="color:#334">·</span>
  <span class="ui-lvl">⭐ Lv.<span id="lvlUi">1</span></span>
  <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
    <div id="xpBar"><div id="xpFill" style="width:0%"></div></div>
    <span style="font-size:10px;color:#445" id="xpUi">0 / 100 XP</span>
  </div>
  <span style="color:#334">·</span>
  <span class="ui-coins">🪙 <span id="coinUi">0</span></span>
</div>
<canvas id="c"></canvas>
<div id="toasts"></div>
<div id="overlay"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
//  CANVAS
// ══════════════════════════════════════════════════════════════════════════════
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay');
const scEl=document.getElementById('sc'),coinUiEl=document.getElementById('coinUi');
const lvlUiEl=document.getElementById('lvlUi'),xpUiEl=document.getElementById('xpUi');
const xpFillEl=document.getElementById('xpFill');
const W=780,H=580;
canvas.width=W;canvas.height=H;

// ══════════════════════════════════════════════════════════════════════════════
//  MAPS
// ══════════════════════════════════════════════════════════════════════════════
const MAPS=[
  {id:'classic',name:'Klassiek',emoji:'🏓',price:0,rarity:'common',source:'shop',
    drawTable(ctx,W,H){
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#2c8050');g.addColorStop(.5,'#1e6b3f');g.addColorStop(1,'#175831');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      const rg=ctx.createRadialGradient(W/2,H/2,30,W/2,H/2,Math.max(W,H)*.7);
      rg.addColorStop(0,'rgba(255,255,255,.1)');rg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(14,14,W-28,H-28);
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(14,H/2);ctx.lineTo(W-14,H/2);ctx.stroke();
    },netColor:'#ffffff',flashGood:'#f1c40f',flashBad:'#e74c3c'},
  {id:'nacht',name:'Nacht',emoji:'🌙',price:30,rarity:'common',source:'shop',
    drawTable(ctx,W,H){
      const g=ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0,'#0a0a1a');g.addColorStop(.5,'#0d0d2b');g.addColorStop(1,'#050510');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.save();
      for(let i=0;i<60;i++){const sx=(i*137+i*i*7)%W,sy=(i*83+i*i*3)%H;
        ctx.globalAlpha=(.4+Math.sin(Date.now()/700+i)*.3)*.7;ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(sx,sy,.9,0,Math.PI*2);ctx.fill();}
      ctx.restore();
      ctx.strokeStyle='rgba(120,80,255,.6)';ctx.lineWidth=3;ctx.strokeRect(14,14,W-28,H-28);
      ctx.strokeStyle='rgba(120,80,255,.2)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(14,H/2);ctx.lineTo(W-14,H/2);ctx.stroke();
    },netColor:'rgba(160,100,255,.9)',flashGood:'#aa88ff',flashBad:'#ff4466'},
  {id:'strand',name:'Strand',emoji:'🏖️',price:50,rarity:'rare',source:'shop',
    drawTable(ctx,W,H){
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#d4a843');g.addColorStop(.5,'#c49430');g.addColorStop(1,'#b08020');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.save();ctx.globalAlpha=.15;
      for(let i=0;i<200;i++){const sx=(i*193)%W,sy=(i*127)%H;
        ctx.fillStyle='#8b6010';ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();}
      ctx.restore();
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.strokeRect(14,14,W-28,H-28);
      ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(14,H/2);ctx.lineTo(W-14,H/2);ctx.stroke();
      ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#1a88cc';
      for(let wave=0;wave<3;wave++){
        const t=Date.now()/800+wave*.8;ctx.beginPath();
        for(let x=0;x<=W;x+=8){const y=H*.08+Math.sin(x/40+t)*10+wave*7;
          wave===0&&x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
        ctx.lineTo(W,0);ctx.lineTo(0,0);ctx.closePath();ctx.fill();}
      ctx.restore();
    },netColor:'rgba(255,255,255,.9)',flashGood:'#ff9933',flashBad:'#cc3300'},
  {id:'ijs',name:'IJs',emoji:'❄️',price:75,rarity:'rare',source:'shop',
    drawTable(ctx,W,H){
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#cce8ff');g.addColorStop(.5,'#a8d4f5');g.addColorStop(1,'#88c0e8');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.save();ctx.globalAlpha=.18;
      for(let i=0;i<12;i++){const x=(i*W/12)+(i%3)*30,y=(i*40)%H;
        const gx=ctx.createLinearGradient(x,y,x+80,y+60);
        gx.addColorStop(0,'rgba(255,255,255,0)');gx.addColorStop(.5,'rgba(255,255,255,.8)');gx.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=gx;ctx.beginPath();ctx.ellipse(x+40,y+30,40,20,.3,0,Math.PI*2);ctx.fill();}
      ctx.restore();
      ctx.strokeStyle='rgba(100,180,255,.7)';ctx.lineWidth=3;ctx.strokeRect(14,14,W-28,H-28);
      ctx.strokeStyle='rgba(100,180,255,.3)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(14,H/2);ctx.lineTo(W-14,H/2);ctx.stroke();
    },netColor:'rgba(100,200,255,.9)',flashGood:'#00eeff',flashBad:'#ff4488'},
  {id:'disco',name:'Disco',emoji:'🪩',price:100,rarity:'epic',source:'shop',
    drawTable(ctx,W,H){
      const hue=(Date.now()/30)%360,g=ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0,`hsl(${hue},70%,11%)`);g.addColorStop(.5,`hsl(${(hue+120)%360},70%,9%)`);g.addColorStop(1,`hsl(${(hue+240)%360},70%,11%)`);
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      const gs=40;
      for(let gx=0;gx<W/gs;gx++)for(let gy=0;gy<H/gs;gy++){
        const b=.055+.035*Math.sin(Date.now()/300+gx+gy);
        ctx.save();ctx.globalAlpha=b;ctx.fillStyle=`hsl(${(hue+gx*20+gy*15)%360},80%,60%)`;
        ctx.fillRect(gx*gs,gy*gs,gs-1,gs-1);ctx.restore();}
      const h2=(hue+180)%360;
      ctx.strokeStyle=`hsl(${h2},90%,65%)`;ctx.lineWidth=3;ctx.strokeRect(14,14,W-28,H-28);
      ctx.strokeStyle=`hsla(${h2},90%,65%,.3)`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(14,H/2);ctx.lineTo(W-14,H/2);ctx.stroke();
    },netColor:'rgba(255,255,255,.9)',flashGood:'#ff00ff',flashBad:'#ff0044'},
  // LOOT / BP exclusive maps
  {id:'volcano',name:'Vulkaan',emoji:'🌋',price:0,rarity:'epic',source:'loot',
    drawTable(ctx,W,H){
      const g=ctx.createLinearGradient(0,H,0,0);
      g.addColorStop(0,'#1a0000');g.addColorStop(.5,'#3d0a00');g.addColorStop(1,'#220800');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.save();
      for(let i=0;i<8;i++){
        const lx=(i*W/8)+Math.sin(Date.now()/600+i)*15;
        const ly=H-30+(i%3)*20;
        const lr=ctx.createRadialGradient(lx,ly,0,lx,ly,60+i*8);

function xpForLevel(lvl){return Math.floor(80*Math.pow(lvl,1.45));}

// ══════════════════════════════════════════════════════════════════════════════
function loadState(){
  try{return JSON.parse(localStorage.getItem('ppb_v3')||'null');}catch(e){return null;}
}
function defaultState(){
  return{
    coins:0,best:0,level:1,xp:0,
    ownedMaps:['classic'],ownedBats:['classic'],
    activeBat:'classic',activeMap:'classic',
    achievements:{},
    stats:{totalHits:0,gamesPlayed:0,totalCoins:0,bestScore:0,cratesOpened:0,legendaryFound:0},
    bpClaimedLvls:[],
    inventory:[],  // loot items in inventory
  };
}
let S=loadState()||defaultState();
function saveState(){localStorage.setItem('ppb_v3',JSON.stringify(S));}

// helpers
function getMap(){return MAPS.find(m=>m.id===S.activeMap)||MAPS[0];}
function getBat(){return BATS.find(b=>b.id===S.activeBat)||BATS[0];}
function shopBatsOwned(){return BATS.filter(b=>b.source==='shop'&&S.ownedBats.includes(b.id)).length;}
function shopMapsOwned(){return MAPS.filter(m=>m.source==='shop'&&S.ownedMaps.includes(m.id)).length;}

//  TOAST NOTIFICATIONS
// ══════════════════════════════════════════════════════════════════════════════
const toastsEl=document.getElementById('toasts');
function showToast(msg,cls='',duration=3500){
  const d=document.createElement('div');
  d.className='toast '+(cls);d.innerHTML=msg;toastsEl.appendChild(d);
  setTimeout(()=>{d.style.animation='toastOut .35s ease forwards';setTimeout(()=>d.remove(),380);},duration);
}

// ══════════════════════════════════════════════════════════════════════════════
//  XP + LEVELING
// ══════════════════════════════════════════════════════════════════════════════
function addXP(amount){
  S.xp+=amount;
  let leveled=false;
  while(S.level<20&&S.xp>=xpForLevel(S.level)){
    S.xp-=xpForLevel(S.level);
    S.level++;
    leveled=true;
    showToast(`⭐ <strong>Level ${S.level} bereikt!</strong><br><small>Smash Seizoen beloningen wachten op je!</small>`,'lvl-toast');
    checkBPRewards();
  }
  updateXpUI();
  checkAchievement('level',S.level);
}

function updateXpUI(){
  lvlUiEl.textContent=S.level;
  const needed=xpForLevel(S.level);
  const pct=S.level>=20?100:Math.min(100,S.xp/needed*100);
  xpFillEl.style.width=pct+'%';
  xpUiEl.textContent=S.level>=20?'MAX':S.xp+' / '+needed+' XP';
}

// ══════════════════════════════════════════════════════════════════════════════
//  ACHIEVEMENTS CHECK
// ══════════════════════════════════════════════════════════════════════════════
function checkAchievement(statKey,value){
  ACHIEVEMENTS.forEach(a=>{
    if(S.achievements[a.id])return;
    let cur=0;
    if(a.stat===statKey)cur=value;
    else{
      const statMap={totalHits:S.stats.totalHits,gamesPlayed:S.stats.gamesPlayed,
        totalCoins:S.stats.totalCoins,bestScore:S.stats.bestScore,level:S.level,
        cratesOpened:S.stats.cratesOpened,legendaryFound:S.stats.legendaryFound,
        shopBatsOwned:shopBatsOwned(),shopMapsOwned:shopMapsOwned()};
      cur=statMap[a.stat]||0;
    }
    if(cur>=a.target){
      S.achievements[a.id]=true;
      S.coins+=a.reward;
      S.stats.totalCoins+=a.reward;
      coinUiEl.textContent=S.coins;
      showToast(`${a.icon} <strong>Prestatie!</strong> ${a.name}<br><small>+${a.reward} muntjes</small>`,'ach-toast',4000);
      saveState();
    }
  });
}

function checkAllAchievements(){
  ['totalHits','gamesPlayed','totalCoins','bestScore','level','cratesOpened','legendaryFound','shopBatsOwned','shopMapsOwned']
    .forEach(k=>checkAchievement(k,0));
}

// ══════════════════════════════════════════════════════════════════════════════
//  BATTLE PASS REWARDS
// ══════════════════════════════════════════════════════════════════════════════
function checkBPRewards(){
  SMASH_SEASON.forEach(node=>{
    if(node.lvl<=S.level&&!S.bpClaimedLvls.includes(node.lvl)){
      claimBPReward(node);
    }
  });
}

function claimBPReward(node){
  S.bpClaimedLvls.push(node.lvl);
  const r=node.reward;
  if(r.type==='coins'){S.coins+=r.amount;S.stats.totalCoins+=r.amount;coinUiEl.textContent=S.coins;}
  else if(r.type==='bat'){if(!S.ownedBats.includes(r.id))S.ownedBats.push(r.id);}
  else if(r.type==='map'){if(!S.ownedMaps.includes(r.id))S.ownedMaps.push(r.id);}
  else if(r.type==='crate'){S.inventory.push({type:'crate',rarity:r.rarity,id:'crate_'+Date.now()});}
  saveState();
  checkAllAchievements();
}

//  LOOT SYSTEM
// ══════════════════════════════════════════════════════════════════════════════
const CRATE_DEFS={
  common:{name:'Gewone Kist',icon:'📦',price:20,color:'common',
    pools:[{rarity:'common',weight:70},{rarity:'rare',weight:25},{rarity:'epic',weight:5}]},
  rare:{name:'Zeldzame Kist',icon:'🎁',price:50,color:'rare',
    pools:[{rarity:'common',weight:40},{rarity:'rare',weight:40},{rarity:'epic',weight:18},{rarity:'legendary',weight:2}]},
  epic:{name:'Epische Kist',icon:'💼',price:100,color:'epic',
    pools:[{rarity:'common',weight:15},{rarity:'rare',weight:35},{rarity:'epic',weight:40},{rarity:'legendary',weight:10}]},
  legendary:{name:'Legendarische Kist',icon:'🏆',price:200,color:'legendary',
    pools:[{rarity:'rare',weight:20},{rarity:'epic',weight:40},{rarity:'legendary',weight:40}]},
};

function rollLoot(pools){
  const total=pools.reduce((a,b)=>a+b.weight,0);
  let roll=Math.random()*total;
  for(const p of pools){roll-=p.weight;if(roll<=0)return p.rarity;}
  return pools[pools.length-1].rarity;
}

function getLootPool(rarity){
  // items available from loot (source='loot'), not already owned
  const items=[...BATS,...MAPS].filter(i=>i.source==='loot'&&i.rarity===rarity);
  // also add coins as always-available fallback
  if(items.length===0||Math.random()<0.35)return{type:'coins',amount:{common:8,rare:20,epic:45,legendary:100}[rarity]};
  const item=items[Math.floor(Math.random()*items.length)];
  return{type:item.id.includes('_')||MAPS.find(m=>m.id===item.id)?'map':'bat',id:item.id,rarity};
}

function openCrate(rarityKey){
  const def=CRATE_DEFS[rarityKey];
  if(S.coins<def.price){showToast('❌ Niet genoeg muntjes!');return;}
  S.coins-=def.price;coinUiEl.textContent=S.coins;
  S.stats.cratesOpened++;
  const rarity=rollLoot(def.pools);
  const loot=getLootPool(rarity);
  // grant item
  let lootName='',lootIcon='📦';
  if(loot.type==='coins'){
    S.coins+=loot.amount;S.stats.totalCoins+=loot.amount;coinUiEl.textContent=S.coins;
    lootName=loot.amount+' Muntjes';lootIcon='🪙';
  } else if(loot.type==='bat'){
    const bat=BATS.find(b=>b.id===loot.id);
    if(bat&&!S.ownedBats.includes(bat.id))S.ownedBats.push(bat.id);
    lootName=bat?bat.name:'Onbekend Batje';lootIcon=bat?bat.emoji:'🏓';
  } else if(loot.type==='map'){
    const map=MAPS.find(m=>m.id===loot.id);
    if(map&&!S.ownedMaps.includes(map.id))S.ownedMaps.push(map.id);
    lootName=map?map.name:'Onbekend Veld';lootIcon=map?map.emoji:'🗺️';
  }
  if(rarity==='legendary'){S.stats.legendaryFound++;checkAchievement('legendaryFound',S.stats.legendaryFound);}
  checkAchievement('cratesOpened',S.stats.cratesOpened);
  checkAllAchievements();
  saveState();
  showLootReveal(rarityKey,rarity,lootIcon,lootName,def);
}

function openInventoryCrate(invId){
  const idx=S.inventory.findIndex(i=>i.id===invId);
  if(idx<0)return;
  const crate=S.inventory.splice(idx,1)[0];
  saveState();
  openCrateNoCharge(crate.rarity);
}

function openCrateNoCharge(rarityKey){
  S.stats.cratesOpened++;
  const def=CRATE_DEFS[rarityKey];
  const rarity=rollLoot(def.pools);
  const loot=getLootPool(rarity);
  let lootName='',lootIcon='📦';
  if(loot.type==='coins'){
    S.coins+=loot.amount;S.stats.totalCoins+=loot.amount;coinUiEl.textContent=S.coins;
    lootName=loot.amount+' Muntjes';lootIcon='🪙';
  } else if(loot.type==='bat'){
    const bat=BATS.find(b=>b.id===loot.id);
    if(bat&&!S.ownedBats.includes(bat.id))S.ownedBats.push(bat.id);
    lootName=bat?bat.name:'Onbekend Batje';lootIcon=bat?bat.emoji:'🏓';
  } else if(loot.type==='map'){
    const map=MAPS.find(m=>m.id===loot.id);
    if(map&&!S.ownedMaps.includes(map.id))S.ownedMaps.push(map.id);
    lootName=map?map.name:'Onbekend Veld';lootIcon=map?map.emoji:'🗺️';
  }
  if(rarity==='legendary'){S.stats.legendaryFound++;checkAchievement('legendaryFound',S.stats.legendaryFound);}
  checkAchievement('cratesOpened',S.stats.cratesOpened);
  saveState();
  showLootReveal(rarityKey,rarity,lootIcon,lootName,def);
}

function showLootReveal(crateRarity,itemRarity,icon,name,def){
  const rarityNames={common:'Gewoon',rare:'Zeldzaam',epic:'Episch',legendary:'Legendarisch'};
  if(itemRarity==='legendary')showToast(`🌠 <strong>LEGENDARISCH!</strong> ${icon} ${name}`,'legendary-toast',6000);
  overlay.innerHTML=`<div class="panel" style="max-width:380px">
    <h1 style="font-size:1.3rem">${def.icon} ${def.name} Geopend!</h1>
    <div class="loot-reveal">
      <div style="font-size:.9rem;color:#778;margin:10px 0">Je hebt gekregen:</div>
      <div class="item-big">${icon}</div>
      <div class="rarity-glow ${itemRarity}">${rarityNames[itemRarity]}</div>
      <div style="font-size:1.1rem;font-weight:700;margin-top:6px">${name}</div>
    </div>
    <div class="btnrow" style="margin-top:16px">
      <button class="btn" onclick="showLoot()">Nog een kist!</button>
      <button class="btn secondary" onclick="showMenu()">Menu</button>
    </div>
  </div>`;
  overlay.style.display='flex';
}

const DIRS=[{name:'Omhoog',dx:0,dy:-1},{name:'Omlaag',dx:0,dy:1},{name:'Links',dx:-1,dy:0},{name:'Rechts',dx:1,dy:0}];
let gameState='menu';
let balls,score,particles,popups,raf;
let racket={x:W/2,y:H/2};
let racketPulse=0,racketSpin=0,shake=0,shakeX=0,shakeY=0,wrongFlash=0,goodFlash=0;
let lastDirIdx=-1,dirStreak=0,effectBag=[];

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  racket.x=(e.clientX-r.left)*sx;racket.y=(e.clientY-r.top)*sy;
});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();const r=canvas.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  racket.x=(e.touches[0].clientX-r.left)*sx;racket.y=(e.touches[0].clientY-r.top)*sy;
},{passive:false});

function rndf(a,b){return a+Math.random()*(b-a);}
function intensity(){return 1+Math.min(score/12,3.5);}

function pickDir(){
  let idx;do{idx=Math.floor(Math.random()*DIRS.length);}while(idx===lastDirIdx&&dirStreak>=2);
  if(idx===lastDirIdx)dirStreak++;else{lastDirIdx=idx;dirStreak=1;}return DIRS[idx];
}

function spawnBall(){
  const side=Math.floor(Math.random()*4);let x,y;
  if(side===0){x=rndf(80,W-80);y=-15;}else if(side===1){x=rndf(80,W-80);y=H+15;}
  else if(side===2){x=-15;y=rndf(80,H-80);}else{x=W+15;y=rndf(80,H-80);}
  const speed=2.2+Math.min(score*.16,10),ang=Math.atan2(H/2-y,W/2-x)+rndf(-.3,.3);
  balls.push({x,y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,r:13,rot:0,dir:pickDir(),
    departing:false,remove:false,cooldown:0,departVx:0,departVy:0,flash:0,spawnT:.3,trail:[]});
}

function outSide(b){
  if(b.y<-40)return'top';if(b.y>H+40)return'bottom';
  if(b.x<-40)return'left';if(b.x>W+40)return'right';return null;
}
function correctSide(dir,side){
  return(dir.dy===-1&&side==='top')||(dir.dy===1&&side==='bottom')||
    (dir.dx===-1&&side==='left')||(dir.dx===1&&side==='right');
}

// ─ HIT EFFECTS ─
const HIT_EFFECTS=['burst','shockwave','confetti','starburst','sparkle','spiral','fireworks','bubbles','bolts','glitter'];
function nextEffect(){
  if(!effectBag.length){effectBag=HIT_EFFECTS.map((_,i)=>i);
    for(let i=effectBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[effectBag[i],effectBag[j]]=[effectBag[j],effectBag[i]];}}
  return HIT_EFFECTS[effectBag.shift()];
}
function makeBolt(x,y,angle,len){
  const pts=[{x,y}],segs=4+Math.floor(Math.random()*3),sl=len/segs;
  const nx=Math.cos(angle),ny=Math.sin(angle),px=-ny,py=nx;
  for(let s=1;s<=segs;s++){const j=rndf(-sl*.5,sl*.5);pts.push({x:x+nx*sl*s+px*j,y:y+ny*sl*s+py*j});}
  return pts;
}
function explodeFirework(p){
  const n=Math.round(14*(p.inten||1)*.7),hue=Math.random()*360;
  for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,spd=1.5+Math.random()*3.5;
    particles.push({type:'spark',x:p.x,y:p.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:1,decay:.03+Math.random()*.02,color:`hsl(${hue+rndf(-20,20)},90%,${rndf(55,70)}%)`,size:2.5+Math.random()*2});}
}
function triggerHitEffect(x,y){
  const inten=intensity(),type=nextEffect();
  if(type==='burst'){const n=Math.round(16*inten);
    for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,spd=(2+Math.random()*5)*(.7+inten*.18);
      particles.push({type:'spark',x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:.025+Math.random()*.02,
        color:`hsl(${rndf(95,150)},85%,${rndf(50,65)}%)`,size:(3+Math.random()*3)*(.8+inten*.12)});}
    if(inten>2.5)particles.push({type:'ring',x,y,radius:5,radiusV:7*inten*.5,life:1,decay:.05,color:'#aaffcc',lineWidth:3});}
  else if(type==='shockwave'){const rings=Math.min(1+Math.floor(inten),4);
    for(let k=0;k<rings;k++)particles.push({type:'ring',x,y,radius:2+k*3,radiusV:(7+k*2)*(.7+inten*.2),
      life:1,decay:.04-k*.004,color:k%2?'#2ecc71':'#ffffff',lineWidth:5-k});
    const n=Math.round(8*inten);
    for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,spd=(1+Math.random()*2)*inten;
      particles.push({type:'spark',x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:.03,color:'#eafff2',size:2+Math.random()*2});}}
  else if(type==='confetti'){const cols=['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#e67e22','#1abc9c'],n=Math.round(16*inten);
    for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,spd=(2+Math.random()*5)*(.8+inten*.16);
      particles.push({type:'confetti',x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2.5,life:1,decay:.012+Math.random()*.01,
        color:cols[k%cols.length],size:(5+Math.random()*4)*(.85+inten*.1),rot:Math.random()*Math.PI,vrot:(Math.random()-.5)*.5,grav:.2});}}
  else if(type==='starburst'){const n=Math.round(10*inten);
    for(let k=0;k<n;k++){const a=(k/n)*Math.PI*2,spd=(4.5+Math.random()*3.5)*(.8+inten*.16);
      particles.push({type:'line',x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:.045,color:'#f1c40f',
        len:(11+Math.random()*9)*(.9+inten*.12),angle:a});}}
  else if(type==='sparkle'){const n=Math.round(12*inten);
    for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,spd=(1+Math.random()*3.5)*(.8+inten*.15);
      particles.push({type:'star',x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:.02+Math.random()*.02,
        color:`hsl(${rndf(40,58)},100%,${rndf(60,72)}%)`,size:(4+Math.random()*5)*(.85+inten*.12),rot:Math.random()*Math.PI,twk:Math.random()*Math.PI*2});}}
  else if(type==='spiral'){const arms=2+Math.floor(inten),n=Math.round(11*inten);
    for(let k=0;k<n;k++){const arm=k%arms,baseAngle=(arm/arms)*Math.PI*2+k*.3;
      particles.push({type:'spiral',cx:x,cy:y,x,y,angle:baseAngle,radius:2+(k/n)*6,rv:1.8+Math.random()*1.6,av:.18+Math.random()*.08,
        life:1,decay:.016+Math.random()*.012,color:`hsl(${rndf(150,205)},85%,60%)`,size:(2.5+Math.random()*2)*(.85+inten*.12)});}}
  else if(type==='fireworks'){const rockets=2+Math.floor(inten);
    for(let k=0;k<rockets;k++){const a=-Math.PI/2+rndf(-.9,.9),spd=3.5+Math.random()*3;
      particles.push({type:'rocket',x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,fuse:10+Math.floor(Math.random()*12),
        life:1,decay:.02,color:`hsl(${rndf(0,60)},100%,62%)`,inten});}}
  else if(type==='bubbles'){const n=Math.round(9*inten);
    for(let k=0;k<n;k++)particles.push({type:'bubble',x:x+rndf(-12,12),y:y+rndf(-8,8),
      radius:(3+Math.random()*5)*(.85+inten*.12),grow:.4+Math.random()*.5,rise:.6+Math.random()*1.4,drift:rndf(-.6,.6),
      life:1,decay:.012+Math.random()*.01,color:`hsl(${rndf(150,200)},70%,70%)`});}
  else if(type==='bolts'){const n=4+Math.floor(inten*1.5);
    for(let k=0;k<n;k++){const a=(k/n)*Math.PI*2+rndf(-.2,.2),len=(28+Math.random()*22)*(.9+inten*.15);
      particles.push({type:'bolt',points:makeBolt(x,y,a,len),life:1,decay:.05+Math.random()*.03,color:Math.random()<.5?'#9be7ff':'#ffffff'});}}
  else if(type==='glitter'){const n=Math.round(20*inten);
    for(let k=0;k<n;k++){const a=rndf(-Math.PI,0),spd=2+Math.random()*5;
      particles.push({type:'glitter',x,y,vx:Math.cos(a)*spd*.7,vy:Math.sin(a)*spd,grav:.16,life:1,
        decay:.012+Math.random()*.01,color:Math.random()<.5?'#f1c40f':'#fff7cc',size:2+Math.random()*2.5,
        rot:Math.random()*Math.PI,twk:Math.random()*Math.PI*2});}}
}

function triggerWrongEffect(x,y){
  for(let k=0;k<18;k++){const a=Math.random()*Math.PI*2,spd=2+Math.random()*4;
    particles.push({type:'spark',x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:.035,
      color:`hsl(${Math.random()*28},90%,55%)`,size:3+Math.random()*2});}
}

function addPopup(x,y,text,col){
  popups.push({x,y,vy:-1.4,life:1,age:0,text,size:22+Math.min(score*.7,28),col:col||'#00ff99'});
}

function registerPoint(x,y){
  score++;S.stats.totalHits++;
  const ec=score%3===0?1:0;
  if(ec){S.coins+=ec;S.stats.totalCoins+=ec;coinUiEl.textContent=S.coins;}
  const xpGain=2+Math.floor(score/10);addXP(xpGain);
  triggerHitEffect(x,y);
  addPopup(x,y-28,ec?'+1 🪙':'+1',ec?'#f1c40f':'#00ff99');
  shake=6+Math.min(score*.35,12);
  goodFlash=Math.min(.04+score*.008,.28);
  updateScore();
  checkAchievement('totalHits',S.stats.totalHits);
  if(score>S.stats.bestScore){S.stats.bestScore=score;checkAchievement('bestScore',S.stats.bestScore);}
}

function startGame(){
  cancelAnimationFrame(raf);
  score=0;particles=[];popups=[];shake=0;wrongFlash=0;goodFlash=0;
  racketPulse=0;racketSpin=0;lastDirIdx=-1;dirStreak=0;effectBag=[];
  balls=[];spawnBall();
  overlay.style.display='none';
  gameState='playing';
  updateScore();
  raf=requestAnimationFrame(loop);
}

function updateScore(){
  scEl.textContent='Score: '+score+(S.best>0?'   ·   Beste: '+S.best:'');
  coinUiEl.textContent=S.coins;
}

function actBalls(){return balls.filter(b=>!b.departing);}

function loop(){
  if(gameState!=='playing')return;
  for(let i=0;i<balls.length;i++){
    const b=balls[i];
    if(!b.departing){
      b.x+=b.vx;b.y+=b.vy;b.rot+=.07;
      if(b.cooldown>0)b.cooldown--;
      const side=outSide(b);
      if(side){if(correctSide(b.dir,side)){registerPoint(b.x,b.y);b.remove=true;}
        else{triggerGameOver('De bal ging er aan de verkeerde kant uit!');return;}}
      else if(b.cooldown<=0){
        const dx=b.x-racket.x,dy=b.y-racket.y,dist=Math.hypot(dx,dy);
        if(dist<b.r+26){
          const nx=dx/dist,ny=dy/dist,alignment=nx*b.dir.dx+ny*b.dir.dy;
          b.x+=nx*(b.r+28-dist+2);b.y+=ny*(b.r+28-dist+2);
          racketPulse=1;racketSpin=(Math.random()<.5?-1:1)*.18;
          if(alignment>.3){const speed=Math.hypot(b.vx,b.vy)*1.1;
            b.departing=true;b.departVx=b.dir.dx*speed;b.departVy=b.dir.dy*speed;b.flash=1;registerPoint(b.x,b.y);}
          else{const dot=b.vx*nx+b.vy*ny;b.vx-=2*dot*nx;b.vy-=2*dot*ny;b.cooldown=8;wrongFlash=1;triggerWrongEffect(b.x,b.y);}}}
    } else {b.x+=b.departVx;b.y+=b.departVy;b.rot+=.12;b.flash=Math.max(0,b.flash-.06);}
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>6)b.trail.shift();
    if(b.spawnT<1)b.spawnT=Math.min(1,b.spawnT+.12);
  }
  balls=balls.filter(b=>!b.remove&&!(b.departing&&outSide(b)));
  if(balls.length===0)spawnBall();
  particles.forEach(p=>{
    switch(p.type){
      case 'ring':p.radius+=p.radiusV;p.radiusV*=.93;p.life-=p.decay;break;
      case 'line':p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;p.life-=p.decay;break;
      case 'confetti':p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=.97;p.rot+=p.vrot;p.life-=p.decay;break;
      case 'spiral':p.angle+=p.av;p.rv*=.985;p.radius+=p.rv;
        p.x=p.cx+Math.cos(p.angle)*p.radius;p.y=p.cy+Math.sin(p.angle)*p.radius;p.life-=p.decay;break;
      case 'bubble':p.y-=p.rise;p.x+=p.drift;p.radius+=p.grow;p.life-=p.decay;break;
      case 'bolt':p.life-=p.decay;break;
      case 'rocket':p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.fuse--;if(p.fuse<=0){explodeFirework(p);p.life=0;}break;
      case 'glitter':p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=.99;p.rot+=.2;p.life-=p.decay;break;
      default:p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;if(p.rot!==undefined)p.rot+=.05;p.life-=p.decay;
    }});
  particles=particles.filter(p=>p.life>0);
  popups.forEach(p=>{p.y+=p.vy;p.vy*=.95;p.life-=.018;p.age++;});
  popups=popups.filter(p=>p.life>0);
  wrongFlash=Math.max(0,wrongFlash-.05);goodFlash=Math.max(0,goodFlash-.08);
  racketPulse=Math.max(0,racketPulse-.08);
  if(shake>0){shakeX=(Math.random()-.5)*shake;shakeY=(Math.random()-.5)*shake;shake*=.78;}else{shakeX=0;shakeY=0;}
  draw();raf=requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════════════════════════════
//  DRAW
// ══════════════════════════════════════════════════════════════════════════════
function draw(){
  ctx.save();ctx.translate(shakeX,shakeY);
  const map=getMap();map.drawTable(ctx,W,H);
  if(goodFlash>0){ctx.globalAlpha=goodFlash;ctx.fillStyle=map.flashGood||'#f1c40f';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(wrongFlash>0){ctx.globalAlpha=wrongFlash*.35;ctx.fillStyle=map.flashBad||'#e74c3c';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  drawNet(map);drawParticles();balls.forEach(drawBall);drawDirectionIndicator();
  getBat().draw(ctx,racket.x,racket.y,racketPulse,racketSpin);
  drawPopups();ctx.restore();
}

function drawNet(map){
  const nx=W/2,top=14,bot=H-14,hw=4;ctx.save();
  ctx.globalAlpha=.28;ctx.strokeStyle=map.netColor||'#fff';ctx.lineWidth=1;
  for(let xx=nx-hw;xx<=nx+hw;xx+=3){ctx.beginPath();ctx.moveTo(xx,top);ctx.lineTo(xx,bot);ctx.stroke();}
  for(let yy=top;yy<=bot;yy+=6){ctx.beginPath();ctx.moveTo(nx-hw,yy);ctx.lineTo(nx+hw,yy);ctx.stroke();}
  ctx.globalAlpha=.85;ctx.strokeStyle=map.netColor||'#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(nx,top);ctx.lineTo(nx,bot);ctx.stroke();
  ctx.globalAlpha=1;ctx.fillStyle='#f0f0f0';
  ctx.beginPath();ctx.arc(nx,top,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(nx,bot,4,0,Math.PI*2);ctx.fill();ctx.restore();
}

function drawSparkle(x,y,r,color,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.fillStyle=color;ctx.beginPath();
  for(let i=0;i<4;i++){const a=i*Math.PI/2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    ctx.lineTo(Math.cos(a+Math.PI/4)*r*.32,Math.sin(a+Math.PI/4)*r*.32);}
  ctx.closePath();ctx.fill();ctx.restore();
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    switch(p.type){
      case 'ring':ctx.strokeStyle=p.color;ctx.lineWidth=Math.max(.5,p.lineWidth*p.life);
        ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.stroke();break;
      case 'confetti':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);ctx.restore();break;
      case 'line':ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-Math.cos(p.angle)*p.len,p.y-Math.sin(p.angle)*p.len);
        ctx.stroke();ctx.lineCap='butt';break;
      case 'star':drawSparkle(p.x,p.y,p.size*(.7+.3*Math.sin(Date.now()/80+p.twk)),p.color,p.rot);break;
      case 'spiral':ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();break;
      case 'bubble':ctx.save();ctx.globalAlpha=Math.max(0,p.life)*.45;ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=Math.max(0,p.life);ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.85)';
        ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.stroke();ctx.restore();break;
      case 'bolt':ctx.save();ctx.globalAlpha=Math.max(0,p.life)*(.55+.45*Math.random());
        ctx.strokeStyle=p.color;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
        ctx.shadowColor='#7fd8ff';ctx.shadowBlur=8;ctx.beginPath();
        p.points.forEach((pt,idx)=>idx?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));ctx.stroke();ctx.restore();break;
      case 'rocket':ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,Math.PI*2);ctx.fill();ctx.restore();break;
      case 'glitter':ctx.save();ctx.globalAlpha=Math.max(0,p.life)*(.4+.6*Math.abs(Math.sin(Date.now()/70+p.twk)));
        ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore();break;
      default:ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size||4,0,Math.PI*2);ctx.fill();
    }});ctx.globalAlpha=1;
}

function drawBall(b){
  for(let i=0;i<b.trail.length-1;i++){
    const t=b.trail[i],a=(i+1)/b.trail.length;
    ctx.globalAlpha=a*.22;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(t.x,t.y,b.r*.7*a,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;ctx.save();ctx.translate(b.x,b.y);ctx.scale(b.spawnT,b.spawnT);ctx.rotate(b.rot);
  if(b.flash>0){ctx.shadowColor='#f1c40f';ctx.shadowBlur=22*b.flash;}
  const g=ctx.createRadialGradient(-b.r*.35,-b.r*.42,b.r*.15,0,0,b.r);
  g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#f1f1f1');g.addColorStop(1,'#cdcdcd');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(150,150,150,.55)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,0,b.r*.62,.4,2.6);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,b.r*.62,.4+Math.PI,2.6+Math.PI);ctx.stroke();
  ctx.globalAlpha=.75;ctx.fillStyle='rgba(255,255,255,.95)';
  ctx.beginPath();ctx.ellipse(-b.r*.34,-b.r*.4,b.r*.28,b.r*.18,-.5,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.restore();
}

const DIR_COLORS={Omhoog:'#00cc44',Rechts:'#f0c000',Omlaag:'#2299ff',Links:'#ee2222'};

function drawDirectionIndicator(){
  const active=actBalls();if(!active.length)return;
  const d=active[0].dir,pad=55;let ax,ay,wx,wy;
  if(d.dy===-1){ax=W/2;ay=pad;wx=W/2;wy=pad+32;}
  else if(d.dy===1){ax=W/2;ay=H-pad;wx=W/2;wy=H-pad-32;}
  else if(d.dx===-1){ax=pad;ay=H/2;wx=pad;wy=H/2+34;}
  else{ax=W-pad;ay=H/2;wx=W-pad;wy=H/2+34;}
  const pulse=1+.1*Math.sin(Date.now()/220);
  const dirColor=DIR_COLORS[d.name]||'#ffffff';

  // draw edge zone highlight strip
  ctx.save();ctx.globalAlpha=0.18+0.07*Math.sin(Date.now()/220);ctx.fillStyle=dirColor;
  if(d.dy===-1)ctx.fillRect(0,0,W,18);
  else if(d.dy===1)ctx.fillRect(0,H-18,W,18);
  else if(d.dx===-1)ctx.fillRect(0,0,18,H);
  else ctx.fillRect(W-18,0,18,H);
  ctx.restore();

  ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
  ctx.save();ctx.translate(ax,ay);ctx.scale(pulse,pulse);
  // draw arrow
  ctx.rotate(Math.atan2(d.dy,d.dx));
  const L=48,w=16,hw=29,hl=24;ctx.fillStyle=dirColor;ctx.beginPath();
  ctx.moveTo(-L/2,-w/2);ctx.lineTo(L/2-hl,-w/2);ctx.lineTo(L/2-hl,-hw/2);ctx.lineTo(L/2,0);
  ctx.lineTo(L/2-hl,hw/2);ctx.lineTo(L/2-hl,w/2);ctx.lineTo(-L/2,w/2);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.fillStyle=dirColor;ctx.font='bold 20px Rajdhani,Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.name,wx,wy);
  ctx.restore();
}

function drawPopups(){
  popups.forEach(p=>{
    const sc=.55+.45*Math.min(1,p.age/7)+(1-p.life)*.35;
    ctx.save();ctx.globalAlpha=Math.min(1,p.life*1.6);ctx.translate(p.x,p.y);ctx.scale(sc,sc);
    ctx.font='bold '+p.size+'px Orbitron,Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(p.text,0,0);
    ctx.fillStyle=p.col||'#00ff99';ctx.fillText(p.text,0,0);ctx.restore();});
  ctx.globalAlpha=1;
}

function triggerGameOver(reden){
  gameState='gameover';
  const ec=Math.floor(score/3);S.coins+=ec;S.stats.totalCoins+=ec;S.stats.gamesPlayed++;
  if(score>S.best)S.best=score;
  addXP(Math.floor(score*1.5));
  checkAchievement('gamesPlayed',S.stats.gamesPlayed);
  checkAchievement('totalCoins',S.stats.totalCoins);
  checkAchievement('bestScore',S.stats.bestScore);
  saveState();coinUiEl.textContent=S.coins;

  let icon='💥',title='Game Over!',body=`${reden}<br>Je sloeg <strong>${score}</strong> ballen weg.`;
  if(score>=50){icon='🏆';title='Ongelooflijk!';}
  else if(score>=25){icon='🔥';title='Lekker bezig!';}
  body+=`<br><br>⭐ <strong>+${Math.floor(score*1.5)} XP</strong> &nbsp;·&nbsp; 🪙 <strong>+${ec} muntjes</strong>`;
  if(score>0&&score===S.best)body+=`<br>🌟 <strong>Nieuwe highscore!</strong>`;

  overlay.innerHTML=`<div class="panel">
    <div style="font-size:2rem">${icon}</div>
    <h1 style="font-size:1.5rem;margin:6px 0">${title}</h1>
    <p class="subtitle">${body}</p>
    <div class="btnrow">
      <button class="btn" onclick="startGame()">Opnieuw</button>
      <button class="btn orange" onclick="showMenu()">Menu</button>
    </div></div>`;
  overlay.style.display='flex';
}

let shopTab='bats';
function showShop(){gameState='shop';renderShop();}
function renderShop(){
  overlay.innerHTML=`<div class="panel" style="max-width:580px">
    <h1 style="font-size:1.4rem">🛒 Winkel</h1>
    <div style="color:var(--coin);font-weight:700;margin-bottom:10px;font-family:'Orbitron',monospace">🪙 ${S.coins} muntjes</div>
    <div class="tabs">
      <button class="tab ${shopTab==='bats'?'active':''}" onclick="shopTab='bats';renderShop()">🏓 Batjes</button>
      <button class="tab ${shopTab==='maps'?'active':''}" onclick="shopTab='maps';renderShop()">🗺️ Velden</button>
    </div>
    <div class="shop-grid" id="sg"></div>
    <div class="btnrow" style="margin-top:14px"><button class="btn secondary" onclick="showMenu()">← Terug</button></div>
  </div>`;
  overlay.style.display='flex';
  const grid=document.getElementById('sg');
  const items=(shopTab==='bats'?BATS:MAPS).filter(i=>i.source==='shop');
  const owned=shopTab==='bats'?S.ownedBats:S.ownedMaps;
  const curActive=shopTab==='bats'?S.activeBat:S.activeMap;
  items.forEach(item=>{
    const isOwned=owned.includes(item.id),isActive=item.id===curActive;
    const div=document.createElement('div');
    div.className='shop-item rarity-'+item.rarity+(isOwned?' owned':'')+(isActive?' active-item':'');
    const prevId='pv_'+item.id+'_'+shopTab;
    let badges='<div class="badge-row">';
    if(isActive)badges+='<span class="badge active">Actief</span>';
    else if(isOwned)badges+='<span class="badge owned">Gekocht</span>';
    badges+='</div>';
    const rarityNames={common:'Gewoon',rare:'Zeldzaam',epic:'Episch',legendary:'Legendarisch'};
    div.innerHTML=`${badges}
      <canvas id="${prevId}" width="74" height="64" style="border-radius:5px"></canvas>
      <div class="rarity-label">${rarityNames[item.rarity]}</div>
      <div class="item-name">${item.emoji} ${item.name}</div>
      <div class="item-price">${item.price===0?'<span style="color:var(--accent)">Gratis</span>':'🪙 '+item.price}</div>
      <div style="margin-top:6px">
      ${isActive?`<button class="btn secondary" style="padding:5px 12px;font-size:.75rem" disabled>✓ In gebruik</button>`:
        isOwned?`<button class="btn secondary" style="padding:5px 12px;font-size:.75rem" onclick="selectItem('${shopTab}','${item.id}')">Selecteer</button>`:
        `<button class="btn ${S.coins>=item.price?'orange':'secondary'}" style="padding:5px 12px;font-size:.75rem" onclick="buyItem('${shopTab}','${item.id}',${item.price})" ${S.coins<item.price?'disabled':''}>Kopen</button>`}
      </div>`;
    grid.appendChild(div);
    setTimeout(()=>{
      const pc=document.getElementById(prevId);if(!pc)return;
      const px=pc.getContext('2d');
      if(shopTab==='maps'){px.save();px.scale(74/W,64/H);item.drawTable(px,W,H);px.restore();}
      else{px.fillStyle='#1a2a1a';px.fillRect(0,0,74,64);item.draw(px,37,28,0,0);}
    },10);
  });
}

function buyItem(tab,id,price){
  if(S.coins<price){showToast('❌ Niet genoeg muntjes!');return;}
  S.coins-=price;
  if(tab==='bats')S.ownedBats.push(id);else S.ownedMaps.push(id);
  selectItem(tab,id);
  checkAllAchievements();
}
function selectItem(tab,id){
  if(tab==='bats')S.activeBat=id;else S.activeMap=id;
  saveState();renderShop();
}

function showAchievements(){

  overlay.style.display='flex';
  const ag=document.getElementById('ag');
  const statMap={totalHits:S.stats.totalHits,gamesPlayed:S.stats.gamesPlayed,
    totalCoins:S.stats.totalCoins,bestScore:S.stats.bestScore,level:S.level,
    cratesOpened:S.stats.cratesOpened,legendaryFound:S.stats.legendaryFound,
    shopBatsOwned:shopBatsOwned(),shopMapsOwned:shopMapsOwned()};
  ACHIEVEMENTS.forEach(a=>{
    const isDone=!!S.achievements[a.id];
    const cur=Math.min(statMap[a.stat]||0,a.target);
    const pct=Math.min(100,cur/a.target*100);
    const div=document.createElement('div');
    div.className='ach-card'+(isDone?' done':'');
    div.innerHTML=`<div class="ach-icon">${isDone?a.icon:'🔒'}</div>
      <div style="flex:1">
        <div class="ach-name">${isDone?a.name:'???'}</div>
        <div class="ach-desc">${isDone?a.desc:'Voltooi om te ontgrendelen'}</div>
        ${!isDone?`<div class="ach-prog">${cur} / ${a.target}</div>
        <div class="ach-prog-bar"><div class="ach-prog-fill" style="width:${pct}%"></div></div>`:''}
        <div class="ach-prog" style="margin-top:3px;color:var(--coin)">Beloning: 🪙 ${a.reward}</div>
      </div>`;
    ag.appendChild(div);
  });
}

// ── LOOT ─────────────────────────────────────────────────────────────────────
let lootTab='buy';
function showLoot(){
  gameState='loot';renderLoot();
}
function renderLoot(){
  const invCrates=S.inventory.filter(i=>i.type==='crate');
  overlay.innerHTML=`<div class="panel" style="max-width:520px">
    <h1 style="font-size:1.4rem">📦 Kisten</h1>
    <div style="color:var(--coin);font-weight:700;margin-bottom:10px;font-family:'Orbitron',monospace">🪙 ${S.coins} muntjes</div>
    <div class="tabs">
      <button class="tab ${lootTab==='buy'?'active':''}" onclick="lootTab='buy';renderLoot()">🛒 Kopen</button>
      <button class="tab ${lootTab==='inv'?'active':''}" onclick="lootTab='inv';renderLoot()">🎒 Inventaris ${invCrates.length>0?'('+invCrates.length+')':''}</button>
    </div>
    ${lootTab==='buy'?renderBuyCrates():renderInventory()}
    <div class="btnrow" style="margin-top:14px"><button class="btn secondary" onclick="showMenu()">← Terug</button></div>
  </div>`;
  overlay.style.display='flex';
}

function renderBuyCrates(){
  return`<div class="crate-grid">
    ${Object.entries(CRATE_DEFS).map(([key,def])=>`
    <div class="crate ${key}-crate" onclick="openCrate('${key}')">
      <div class="crate-icon">${def.icon}</div>
      <div class="crate-name">${def.name}</div>
      <div class="crate-price">🪙 ${def.price}</div>
      <div class="crate-odds">${crateOddsText(key)}</div>
      <div style="margin-top:8px"><button class="btn ${S.coins>=def.price?'orange':'secondary'}" style="padding:6px 14px;font-size:.78rem" ${S.coins<def.price?'disabled':''}>Openen</button></div>
    </div>`).join('')}
  </div>
  <div style="font-size:.78rem;color:#445;margin-top:8px">Kisten bevatten exclusieve batjes, velden en muntjes die je niet in de winkel kunt kopen.</div>`;
}

function crateOddsText(key){
  const pools=CRATE_DEFS[key].pools;
  return pools.map(p=>{
    const n={common:'Gewoon',rare:'Zeldzaam',epic:'Episch',legendary:'Legendarisch'}[p.rarity];
    const total=pools.reduce((a,b)=>a+b.weight,0);
    return`${n}: ${Math.round(p.weight/total*100)}%`;
  }).join(' · ');
}

function renderInventory(){
  const invCrates=S.inventory.filter(i=>i.type==='crate');
  if(!invCrates.length)return`<div style="color:#445;text-align:center;padding:20px">Je hebt nog geen kisten in je inventaris.<br>Speel het Smash Seizoen om gratis kisten te verdienen!</div>`;
  return`<div class="crate-grid">${invCrates.map(inv=>{
    const def=CRATE_DEFS[inv.rarity];
    return`<div class="crate ${inv.rarity}-crate">
      <div class="crate-icon">${def.icon}</div>
      <div class="crate-name">${def.name}</div>
      <div class="crate-odds">${crateOddsText(inv.rarity)}</div>
      <div style="margin-top:8px"><button class="btn orange" style="padding:6px 14px;font-size:.78rem" onclick="openInventoryCrate('${inv.id}')">Openen!</button></div>
    </div>`;}).join('')}</div>`;
}

checkBPRewards();
updateXpUI();
updateScore();
showMenu();
</script>
